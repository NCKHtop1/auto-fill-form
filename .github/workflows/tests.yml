name: PandaStudy checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir playwright==1.55.0 openpyxl==3.1.5
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Static JavaScript syntax
        run: node --check app.js
      - name: Blog JavaScript syntax
        run: node --check blog-data.js
      - name: Browser QA
        run: .venv/bin/python tests/smoke.py
      - name: PandaStudy native JavaScript and backend tests
        run: |
          npm ci --prefix native
          node --check native/blog.js
          node --check .github/scripts/publish-blog.cjs
          node --test tests/publish-blog.test.cjs
          (cd native && npm test && npm run check)
      - name: Test real public Google Form (read-only; never submit responses)
        env:
          PANDASTUDY_LIVE_TEST: '1'
        run: node --test native/tests/live-form.test.js
      - name: PandaStudy blog and editor browser QA
        run: .venv/bin/python tests/native_smoke.py
      - name: QA submission flow browser test (mocked; no Google writes)
        run: .venv/bin/python tests/qa_browser.py
      - name: Mandatory login wall browser UAT (mocked; no external writes)
        run: .venv/bin/python tests/auth_gate_browser.py
      - name: Billing and admin browser UAT (mocked; no payments or emails)
        run: .venv/bin/python tests/billing_browser.py
      - name: Premium motion UI browser UAT (mocked; presentation only)
        run: .venv/bin/python tests/motion_ui_browser.py
      - name: Comprehensive UX, responsive and accessibility audit
        run: .venv/bin/python tests/ux_audit.py
      - name: Post-merge production browser smoke (read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: .venv/bin/python tests/production_smoke.py
      - name: Upload QA evidence (screenshots + test results)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pandastudy-ux-audit
          path: qa-artifacts/
          retention-days: 14
          if-no-files-found: ignore
  billing-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pandastudy_test
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: pandastudy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandastudy_test -d pandastudy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked backend dependencies
        run: npm ci --prefix native
      - name: PostgreSQL transactions, duplicate approvals and concurrent credit UAT
        env:
          BILLING_TEST_DATABASE_URL: postgresql://pandastudy_test:ephemeral_ci_password@localhost:5432/pandastudy_ci
        run: cd native && npm run test:postgres
