name: PandaStudy checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir playwright==1.55.0 openpyxl==3.1.5
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Static JavaScript syntax
        run: node --check app.js
      - name: Blog JavaScript syntax
        run: node --check blog-data.js
      - name: Browser QA
        run: .venv/bin/python tests/smoke.py
